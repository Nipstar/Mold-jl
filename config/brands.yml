# Canonical franchise/national-chain brand list for franchise_brand matching
# (Stage A pipeline hardening, see docs/superpowers/specs). Each entry:
#   name: canonical brand name stored in maps_companies.franchise_brand
#   name_substrings: case-insensitive whole-word/phrase substrings matched
#     against the business name. Must be specific to the brand -- never a
#     generic industry word like "restoration" alone.
#   domains: website root domains (no protocol/www/path) matched against the
#     row's website root domain.
brands:
  - name: SERVPRO
    name_substrings: ["SERVPRO"]
    domains: ["servpro.com"]
  - name: ServiceMaster
    name_substrings: ["SERVICEMASTER"]
    domains: ["servicemaster.com", "servicemasterrestore.com", "servicemasterclean.com"]
